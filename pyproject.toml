[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cms"
version = "0.1.0"
description = "Cabin monitoring on the vehicle."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dms*", "cms*", "guardian*", "pipeline*"]
